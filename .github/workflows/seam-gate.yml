name: seam-gate

# dsh-seam Level 1 契约门禁（coupling.json 提交于 packages/socket）：
#   scan --check —— 防改了源码忘更新契约（嫌疑清单为 advisory，Level 2 后判红）
#   verify       —— 防上游 @deepseek-ai/* 破坏插件用到的类型/服务/事件签名
# 版本锚：钉住 dsh-seam 的具体 commit（origin.md 原则 3：不拉浮动 HEAD）；
# 升级时把两处 ref 一并换成新 tag/commit。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: coupling drift gate (scan --check)
        run: npx github:YMoose/dsh-seam#9c46cfdeadc65440c423da297ed18730ad28772b scan --root packages/socket --check
      - name: contract compile gate (verify)
        run: npx github:YMoose/dsh-seam#9c46cfdeadc65440c423da297ed18730ad28772b verify --repo packages/socket
